{% for e in form.non_field_errors %}<p class="error" role="alert">{{ e }}</p>{% endfor %}
{% for field in form %}
<div class="field">
  {% if field.widget_type == "checkbox" %}
    <label class="check" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error" role="alert">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
